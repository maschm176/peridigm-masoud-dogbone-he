Peridigm:

#     Dogbone specimen (examples/tensile_test/tensile_test.g), loaded as a
#     tensile test with the same material/solver approach used for the
#     cylinder_tensile_test example (bond-based Elastic Plastic Hardening,
#     explicit Verlet). Node sets reused from the mesh's original
#     correspondence-based example (examples/tensile_test/tensile_test.yaml):
#     nodelist_1/2 = bottom/top pull faces, nodelist_3-6 = rigid-body fixes.

  Discretization:
      Type: "Exodus"
      Input Mesh File: "tensile_test.g"

  Materials:
      My Material:
          Material Model: "Elastic Plastic Hardening"
          Density: 7800.0
          Bulk Modulus: 130.0e9
          Shear Modulus: 78.0e9
          Yield Stress: 2.5e8
          Hardening Modulus: 1.0e9

  Blocks:
      My Block:
          Block Names: "block_1 block_2 block_3"
          Material: "My Material"
          Horizon: 0.16

  Boundary Conditions:
      Prescribed Displacement Bottom:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_1"
          Coordinate: "y"
          Value: "y*3.0*t"
      Prescribed Displacement Top:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_2"
          Coordinate: "y"
          Value: "y*3.0*t"
      Prescribed Displacement Fix Bottom Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_3"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Bottom Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_4"
          Coordinate: "z"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_5"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_6"
          Coordinate: "z"
          Value: "0.0"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.0e-3
      Verlet:
          Safety Factor: 0.7

  Output:
      Output File Type: "ExodusII"
      Output Filename: "dogbone_tensile_test"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Force: true
