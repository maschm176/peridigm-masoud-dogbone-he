Peridigm:

#     Dogbone specimen calibration template: Isotropic Hardening Hypoelastic
#     Correspondence with Voce ("Saturation type exponential") hardening +
#     Brozzo/Wellman ductile damage (Behzadinasab & Foster 2020, "Revisiting
#     the third Sandia Fracture Challenge"). This swaps out the Johnson Cook
#     damage law (which drives bond failure off triaxiality alone) for a
#     rate-form law driven by bond-level maximum principal stress and
#     hydrostatic stress:
#         D_dot = d1 * <2*sigmaT/(3*(sigmaT-sigmaM))>^d2 * eqps_dot
#     gated to tension only. See Peridigm_BrozzoDamageModel.cpp/.hpp and the
#     Bond_Max_Principal_Stress field added to
#     isotropic_hardening_correspondence.cxx's Saturation-type-exponential
#     bond-level update. Requires the peridigm-masoud:voce-hypoelastic-brozzo
#     image (set via the IMAGE env var in the wrapper driver script), rebuilt
#     2026-09-30 to add the "Hard Cutoff" option below.
#
#     Units are CGS, matching the mesh, same as the original template.
#
#     Variant: sets "Hard Cutoff: true" -- Option 2 from the post-fracture
#     oscillation investigation (see CLAUDE.md, "Post-fracture oscillation"
#     section). Root cause found: individual bonds near the crack accumulate
#     PARTIAL damage but almost never reach full failure (D=1) under the
#     default linear ramp -- they get stuck indefinitely in a partially
#     degraded state while the aggregate force-drop-based fracture criterion
#     already fires, and that patchy, never-fully-clearing damage field,
#     still being actively stretched by the rigid grip BC, is what rings.
#     Option 1 (lowering "Critical Damage To Neglect Material Point" to
#     freeze nearly-failed points) was tried first and made things worse --
#     it caused a numerical blowup and NaN crash, likely because a "frozen"
#     point's stress state goes stale while its geometry keeps integrating
#     and its still-active neighbors keep referencing it, and since bonds
#     here never truly reach full severance, a frozen point isn't actually
#     mechanically detached.
#
#     Hard Cutoff instead changes the damage LAW itself: once a bond's own
#     accumulated damage D crosses Threshold Damage, bondDamage jumps
#     directly to 1.0 (full break) instead of ramping gradually over
#     [ThresholdDamage, 1.0]. This matches the original paper's own damage
#     law exactly (omega_D = 1 if D < Dc, else 0) rather than approximating
#     it, and directly removes the population of long-lived, partially-
#     damaged bonds identified as the oscillation's root cause -- bonds
#     either carry full strength or none, with no lingering partial state.
#     Known risk: an abrupt, large single-step stiffness loss is exactly
#     what caused "Too many iterations in the plastic radial return" crashes
#     earlier in this project under Johnson-Cook, before the plasticity
#     solver's relative-tolerance fix (isotropic_hardening_correspondence.cxx)
#     was added -- that fix should help here too, but this run is the first
#     real test of Hard Cutoff under Voce+Brozzo.
#
#     Also sets "Critical Damage To Neglect Material Point: 1.5" (above 1.0,
#     so it can never trigger, since the averaged field it gates on is
#     mathematically bounded to [0,1]) to fully disable the Flying_Point_Flag
#     freeze mechanism for this run. Under Hard Cutoff, bonds reach true
#     zero-weight much more readily, so a point's Broken_Bond_Volume_Averaged
#     would likely climb past the *default* 0.95 freeze threshold for real
#     (not just via an artificially-lowered cutoff like the Option 1 test) --
#     and that freeze mechanism was just shown to be numerically unsound
#     regardless of what legitimately triggers it (it freezes a point's
#     stress while its geometry keeps integrating and active neighbors keep
#     referencing it). Disabling it here isolates Hard Cutoff's effect
#     cleanly: if this run is still unstable, it's Hard Cutoff itself, not
#     this second mechanism reappearing through a different door.

  Discretization:
      Type: "Exodus"
      Input Mesh File: "tensile_test.g"

  Materials:
      My Material:
          Material Model: "Isotropic Hardening Hypoelastic Correspondence"
          Density: 7.8
          Bulk Modulus: 1.30e12
          Shear Modulus: 7.8e11
          Hardening Rule: "Saturation type exponential"
          Initial Yield Stress: {InitialYieldStress}
          Saturated Yield Stress: {SaturatedYieldStress}
          Exponential Constant: {ExponentialConstant}
          Linear Constant: {LinearConstant}
          Actual Horizon: 0.189

  Damage Models:
      My Damage Model:
          Damage Model: "Brozzo"
          Damage Parameter 1: {DamageParameter1}
          Damage Parameter 2: {DamageParameter2}
          Threshold Damage: {ThresholdDamage}
          Hard Cutoff: true
          Critical Damage To Neglect Material Point: 1.5

  Blocks:
      My Block:
          Block Names: "block_1 block_2 block_3"
          Material: "My Material"
          Damage Model: "My Damage Model"
          Horizon: 0.236

  Boundary Conditions:
      Prescribed Displacement Bottom:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_1"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Top:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_2"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Fix Bottom Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_3"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Bottom Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_4"
          Coordinate: "z"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_5"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_6"
          Coordinate: "z"
          Value: "0.0"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.84e-3
      Verlet:
          Safety Factor: 0.7

  Compute Class Parameters:
      Strain Gage Top Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Top_Initial_Position"
      Strain Gage Bottom Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Bottom_Initial_Position"
      Strain Gage Top Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Top_Displacement"
      Strain Gage Bottom Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Bottom_Displacement"
      Top Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_3"
          Variable: "Force"
          Output Label: "Top_Reaction_Force"
      Bottom Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_1"
          Variable: "Force"
          Output Label: "Bottom_Reaction_Force"

  Output:
      Output File Type: "ExodusII"
      Output Filename: "output"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Force: true
          Gage_Top_Displacement: true
          Gage_Bottom_Displacement: true
          Top_Reaction_Force: true
          Bottom_Reaction_Force: true
          Damage: true
          Broken_Bond_Volume_Averaged: true
          Flying_Point_Flag: true
