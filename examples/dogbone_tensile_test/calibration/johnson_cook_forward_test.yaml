Peridigm:

#     Forward-solve validation of the Johnson Cook damage model, now that
#     the Jacobian_Determinant field-name collision with Bond Associated
#     Correspondence materials has been patched (renamed to
#     Bond_Jacobian_Determinant in the material's own internal registration;
#     see src/materials/Peridigm_BondAssociatedCorrespondenceMaterial.cpp)
#     and the image rebuilt as peridigm-masoud:johnson-cook. Voce hardening
#     parameters are the final locked-in HE_0 optimum (eval 23 of the full
#     joint campaign, objective 0.060 -- see CLAUDE.md), not the eval-13
#     interim point used for the original diagnostic forward solve.
#     Damage Parameter 1/2/3 starting values are informed by that diagnostic
#     (voce_best_diagnostic.yaml/.log): local plastic strain at the neck
#     hit ~0.337 almost exactly at the real 15.37% fracture strain, so
#     D1=0.30, D2=0.04, D3=0.0 targets a roughly flat fracture-strain
#     criterion around that value, sidestepping the triaxiality-sign
#     oddity noted in that diagnostic (trended negative at the neck,
#     opposite classical Bridgman theory) for this first validation pass.
#     Threshold Damage / Critical Damage are placeholder guesses (0.5 / 0.9)
#     pending this run's results.

  Discretization:
      Type: "Exodus"
      Input Mesh File: "tensile_test.g"

  Materials:
      My Material:
          Material Model: "Isotropic Hardening Bond Associated Correspondence"
          Density: 7.8
          Bulk Modulus: 1.30e12
          Shear Modulus: 7.8e11
          Hardening Rule: "Saturation type exponential"
          Hardening Parameters:
              Initial Yield Stress: 9.27e9
              Saturated Yield Stress: 1.35e10
              Exponential Constant: 22.0
              Linear Constant: 2.0e8

  Damage Models:
      My Damage Model:
          Damage Model: "Johnson Cook"
          Damage Parameter 1: 0.30
          Damage Parameter 2: 0.04
          Damage Parameter 3: 0.0
          Threshold Damage: 0.5
          Critical Damage: 0.9

  Blocks:
      My Block:
          Block Names: "block_1 block_2 block_3"
          Material: "My Material"
          Damage Model: "My Damage Model"
          Horizon: 0.189

  Boundary Conditions:
      Prescribed Displacement Bottom:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_1"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Top:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_2"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Fix Bottom Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_3"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Bottom Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_4"
          Coordinate: "z"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_5"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_6"
          Coordinate: "z"
          Value: "0.0"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.84e-3
      Verlet:
          Safety Factor: 0.7

  Compute Class Parameters:
      Strain Gage Top Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Top_Initial_Position"
      Strain Gage Bottom Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Bottom_Initial_Position"
      Strain Gage Top Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Top_Displacement"
      Strain Gage Bottom Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Bottom_Displacement"
      Top Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_3"
          Variable: "Force"
          Output Label: "Top_Reaction_Force"
      Bottom Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_1"
          Variable: "Force"
          Output Label: "Bottom_Reaction_Force"

  Output:
      Output File Type: "ExodusII"
      Output Filename: "johnson_cook_forward_test"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Force: true
          Gage_Top_Displacement: true
          Gage_Bottom_Displacement: true
          Top_Reaction_Force: true
          Bottom_Reaction_Force: true
          Von_Mises_Stress: true
          Equivalent_Plastic_Strain: true
          Stress_Triaxiality: true
          Damage: true
