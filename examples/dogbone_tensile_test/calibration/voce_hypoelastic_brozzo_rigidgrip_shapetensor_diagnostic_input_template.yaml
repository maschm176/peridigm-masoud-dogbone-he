Peridigm:

#     Dogbone specimen diagnostic template: same as
#     voce_hypoelastic_brozzo_rigidgrip_input_template.yaml (Voce hardening +
#     Brozzo damage, locked-in HE_0 parameters, rigid-grip BC at 220 cm/s,
#     ramp mode -- no Hard Cutoff), but with "Shape_Tensor_Min_Singular_Value"
#     and "Shape_Tensor_Max_Singular_Value" added to Output Variables.
#     Purpose: test the Lagrangian-family rank-deficiency hypothesis raised
#     in Behzadinasab & Foster 2019 (SFC3 initial paper, Section 5 / Fig. 15)
#     -- as damage removes bonds from a point's fixed neighborhood, the
#     surviving bonds' moment matrix (this material's analog of the
#     classic shape tensor K, built via a reproducing-kernel/implicit-
#     gradient operator, see computeGradientWeights in correspondence.cxx)
#     can become nearly singular/rank-deficient if the survivors are no
#     longer well-distributed directionally -- and this already goes
#     completely undetected in our code: invertAndCond (correspondence.cxx)
#     does an SVD-based pseudo-inverse that silently truncates small
#     singular values and unconditionally returns success regardless of
#     how ill-conditioned the matrix was. These two new fields surface the
#     per-point min/max singular values of that moment matrix (captured at
#     the exact point they're already computed inside invertAndCond, no
#     new computation, just reporting) so we can directly check for
#     near-zero min-singular-value points (rank deficiency) at/after the
#     neck during post-fracture ringing. See CLAUDE.md for full citation
#     and context. Requires the peridigm-masoud:voce-hypoelastic-brozzo-
#     shapetensor image (rebuilt with this diagnostic wired in -- see
#     correspondence.h/.cxx and Peridigm_HypoelasticCorrespondenceMaterial.
#     hpp/.cpp).
#
#     Units are CGS, matching the mesh, same as the original template.

  Discretization:
      Type: "Exodus"
      Input Mesh File: "tensile_test.g"

  Materials:
      My Material:
          Material Model: "Isotropic Hardening Hypoelastic Correspondence"
          Density: 7.8
          Bulk Modulus: 1.30e12
          Shear Modulus: 7.8e11
          Hardening Rule: "Saturation type exponential"
          Initial Yield Stress: {InitialYieldStress}
          Saturated Yield Stress: {SaturatedYieldStress}
          Exponential Constant: {ExponentialConstant}
          Linear Constant: {LinearConstant}
          Actual Horizon: 0.189

  Damage Models:
      My Damage Model:
          Damage Model: "Brozzo"
          Damage Parameter 1: {DamageParameter1}
          Damage Parameter 2: {DamageParameter2}
          Threshold Damage: {ThresholdDamage}

  Blocks:
      My Block:
          Block Names: "block_1 block_2 block_3"
          Material: "My Material"
          Damage Model: "My Damage Model"
          Horizon: 0.236

  Boundary Conditions:
      Prescribed Displacement Bottom:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_1"
          Coordinate: "y"
          Value: "-220.0*t"
      Prescribed Displacement Top:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_2"
          Coordinate: "y"
          Value: "220.0*t"
      Prescribed Displacement Fix Bottom Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_3"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Bottom Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_4"
          Coordinate: "z"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_5"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_6"
          Coordinate: "z"
          Value: "0.0"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.84e-3
      Verlet:
          Safety Factor: 0.7

  Compute Class Parameters:
      Strain Gage Top Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Top_Initial_Position"
      Strain Gage Bottom Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Bottom_Initial_Position"
      Strain Gage Top Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Top_Displacement"
      Strain Gage Bottom Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Bottom_Displacement"
      Top Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_3"
          Variable: "Force"
          Output Label: "Top_Reaction_Force"
      Bottom Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_1"
          Variable: "Force"
          Output Label: "Bottom_Reaction_Force"

  Output:
      Output File Type: "ExodusII"
      Output Filename: "output"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Force: true
          Gage_Top_Displacement: true
          Gage_Bottom_Displacement: true
          Top_Reaction_Force: true
          Bottom_Reaction_Force: true
          Damage: true
          Shape_Tensor_Min_Singular_Value: true
          Shape_Tensor_Max_Singular_Value: true
