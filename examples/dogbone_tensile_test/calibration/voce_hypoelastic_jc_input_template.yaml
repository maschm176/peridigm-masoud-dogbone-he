Peridigm:

#     Dogbone specimen calibration template: Isotropic Hardening Hypoelastic
#     Correspondence with Voce ("Saturation type exponential") hardening +
#     Johnson Cook damage. Voce hardening was added to this material
#     (previously power-law only) because power-law's hardening-modulus math
#     can't reproduce this data's sharp yield knee no matter how it's tuned
#     -- see CLAUDE.md "Voce-under-Hypoelastic pivot" section for the full
#     Considere-criterion analysis and the source change itself
#     (Peridigm_IsotropicHardeningPlasticHypoelasticCorrespondenceMaterial
#     .cpp/.hpp). Requires the peridigm-masoud:voce-hypoelastic image (set
#     via the IMAGE env var in the wrapper driver script), not
#     peridigm-masoud:latest.
#
#     "Critical Damage" is fixed (not templated) at a safe constant above any
#     Threshold Damage this search will try -- it's read and validated
#     (must be < 1.0 and > Threshold Damage) but never actually consumed
#     anywhere in JohnsonCookDamageModel's damage-evolution logic, so it has
#     no effect on results and isn't worth spending a search dimension on.
#     Set to 0.999 (not 0.95) so Stage 2's near-hard-cutoff ThresholdDamage
#     (~0.97, approximating the instant bond-cutoff damage function used in
#     Behzadinasab & Foster's SFC3 paper -- see CLAUDE.md) doesn't violate
#     the ThresholdDamage < CriticalDamage validation.
#
#     Units are CGS, matching the mesh, same as the original template.

  Discretization:
      Type: "Exodus"
      Input Mesh File: "tensile_test.g"

  Materials:
      My Material:
          Material Model: "Isotropic Hardening Hypoelastic Correspondence"
          Density: 7.8
          Bulk Modulus: 1.30e12
          Shear Modulus: 7.8e11
          Hardening Rule: "Saturation type exponential"
          Initial Yield Stress: {InitialYieldStress}
          Saturated Yield Stress: {SaturatedYieldStress}
          Exponential Constant: {ExponentialConstant}
          Linear Constant: {LinearConstant}
          Actual Horizon: 0.189

  Damage Models:
      My Damage Model:
          Damage Model: "Johnson Cook"
          Damage Parameter 1: {DamageParameter1}
          Damage Parameter 2: {DamageParameter2}
          Damage Parameter 3: {DamageParameter3}
          Threshold Damage: {ThresholdDamage}
          Critical Damage: 0.999

  Blocks:
      My Block:
          Block Names: "block_1 block_2 block_3"
          Material: "My Material"
          Damage Model: "My Damage Model"
          Horizon: 0.236

  Boundary Conditions:
      Prescribed Displacement Bottom:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_1"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Top:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_2"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Fix Bottom Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_3"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Bottom Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_4"
          Coordinate: "z"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_5"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_6"
          Coordinate: "z"
          Value: "0.0"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.84e-3
      Verlet:
          Safety Factor: 0.7

  Compute Class Parameters:
      Strain Gage Top Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Top_Initial_Position"
      Strain Gage Bottom Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Bottom_Initial_Position"
      Strain Gage Top Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Top_Displacement"
      Strain Gage Bottom Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Bottom_Displacement"
      Top Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_3"
          Variable: "Force"
          Output Label: "Top_Reaction_Force"
      Bottom Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_1"
          Variable: "Force"
          Output Label: "Bottom_Reaction_Force"

  Output:
      Output File Type: "ExodusII"
      Output Filename: "output"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Force: true
          Gage_Top_Displacement: true
          Gage_Bottom_Displacement: true
          Top_Reaction_Force: true
          Bottom_Reaction_Force: true
          Damage: true
