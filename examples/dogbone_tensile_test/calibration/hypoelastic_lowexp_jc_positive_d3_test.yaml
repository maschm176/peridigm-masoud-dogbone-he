Peridigm:

#     Follow-up to hypoelastic_lowexp_necking_test.yaml, which confirmed
#     HardeningExponent=0.28 produces genuine geometry-driven softening
#     starting ~16% strain with damage disabled. This run turns Johnson
#     Cook damage back ON with the ORIGINAL, physically-correct-sign D3
#     (positive -- higher triaxiality in the neck should REDUCE fracture
#     strain there, not increase it) and the original D1/D2 guess, to see
#     whether the now-real necking gives JC a small enough job that a
#     positive D3 can catch the final fracture near 15.37% without needing
#     the non-physical negative-D3 workaround the higher-exponent runs
#     required (see the Stage 2/3 crash investigation for why negative D3
#     is dangerous: exp(-D3*triaxiality) overflows when D3<0 and
#     triaxiality spikes in the neck).

  Discretization:
      Type: "Exodus"
      Input Mesh File: "tensile_test.g"

  Materials:
      My Material:
          Material Model: "Isotropic Hardening Hypoelastic Correspondence"
          Density: 7.8
          Bulk Modulus: 1.30e12
          Shear Modulus: 7.8e11
          Yield Stress: 1.0455332647e10
          Hardening Characteristic Strain: 1.3609018823e-01
          Hardening Exponent: 2.8e-01
          Actual Horizon: 0.189

  Damage Models:
      My Damage Model:
          Damage Model: "Johnson Cook"
          Damage Parameter 1: 0.30
          Damage Parameter 2: 0.04
          Damage Parameter 3: 0.3
          Threshold Damage: 0.5
          Critical Damage: 0.95

  Blocks:
      My Block:
          Block Names: "block_1 block_2 block_3"
          Material: "My Material"
          Damage Model: "My Damage Model"
          Horizon: 0.236

  Boundary Conditions:
      Prescribed Displacement Bottom:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_1"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Top:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_2"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Fix Bottom Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_3"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Bottom Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_4"
          Coordinate: "z"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_5"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_6"
          Coordinate: "z"
          Value: "0.0"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.84e-3
      Verlet:
          Safety Factor: 0.7

  Compute Class Parameters:
      Strain Gage Top Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Top_Initial_Position"
      Strain Gage Bottom Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Bottom_Initial_Position"
      Strain Gage Top Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Top_Displacement"
      Strain Gage Bottom Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Bottom_Displacement"
      Top Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_3"
          Variable: "Force"
          Output Label: "Top_Reaction_Force"
      Bottom Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_1"
          Variable: "Force"
          Output Label: "Bottom_Reaction_Force"

  Output:
      Output File Type: "ExodusII"
      Output Filename: "hypoelastic_lowexp_jc_positive_d3_test"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Force: true
          Gage_Top_Displacement: true
          Gage_Bottom_Displacement: true
          Top_Reaction_Force: true
          Bottom_Reaction_Force: true
          Von_Mises_Stress: true
          Equivalent_Plastic_Strain: true
          Stress_Triaxiality: true
          Damage: true
