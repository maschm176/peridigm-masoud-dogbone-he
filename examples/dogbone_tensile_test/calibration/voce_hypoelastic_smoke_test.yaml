Peridigm:

#     Smoke test for the new "Saturation type exponential" (Voce) hardening
#     rule added to Isotropic Hardening Hypoelastic Correspondence (see
#     Peridigm_IsotropicHardeningPlasticHypoelasticCorrespondenceMaterial
#     .cpp/.hpp -- mirrors the dispatch pattern already used by
#     IsotropicHardeningPlasticBondAssociatedCorrespondenceMaterial, which
#     reuses the same shared Voce kernel functions in
#     isotropic_hardening_correspondence.h/.cxx). Voce parameters are the
#     original HE_0 optimum from the old bond-associated-correspondence
#     work (InitialYieldStress=9.27e9, SaturatedYieldStress=1.35e10,
#     ExponentialConstant=22.0, LinearConstant=2.0e8). Damage disabled
#     (Damage Parameter 1 = 5.0, Threshold Damage = 0.9 < Critical
#     Damage = 0.95) so this only exercises the hardening dispatch.
#     Final Time cut to 10% of the full run (1.84e-4 vs 1.84e-3) for a
#     fast (~5 min) smoke test before committing to a full run.

  Discretization:
      Type: "Exodus"
      Input Mesh File: "tensile_test.g"

  Materials:
      My Material:
          Material Model: "Isotropic Hardening Hypoelastic Correspondence"
          Density: 7.8
          Bulk Modulus: 1.30e12
          Shear Modulus: 7.8e11
          Hardening Rule: "Saturation type exponential"
          Initial Yield Stress: 9.27e9
          Saturated Yield Stress: 1.35e10
          Exponential Constant: 22.0
          Linear Constant: 2.0e8
          Actual Horizon: 0.189

  Damage Models:
      My Damage Model:
          Damage Model: "Johnson Cook"
          Damage Parameter 1: 5.0
          Damage Parameter 2: 0.0
          Damage Parameter 3: 0.0
          Threshold Damage: 0.9
          Critical Damage: 0.95

  Blocks:
      My Block:
          Block Names: "block_1 block_2 block_3"
          Material: "My Material"
          Damage Model: "My Damage Model"
          Horizon: 0.236

  Boundary Conditions:
      Prescribed Displacement Bottom:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_1"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Top:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_2"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Fix Bottom Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_3"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Bottom Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_4"
          Coordinate: "z"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_5"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_6"
          Coordinate: "z"
          Value: "0.0"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.84e-4
      Verlet:
          Safety Factor: 0.7

  Compute Class Parameters:
      Strain Gage Top Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Top_Initial_Position"
      Strain Gage Bottom Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Bottom_Initial_Position"
      Strain Gage Top Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Top_Displacement"
      Strain Gage Bottom Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Bottom_Displacement"
      Top Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_3"
          Variable: "Force"
          Output Label: "Top_Reaction_Force"
      Bottom Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_1"
          Variable: "Force"
          Output Label: "Bottom_Reaction_Force"

  Output:
      Output File Type: "ExodusII"
      Output Filename: "voce_hypoelastic_smoke_test"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Force: true
          Gage_Top_Displacement: true
          Gage_Bottom_Displacement: true
          Top_Reaction_Force: true
          Bottom_Reaction_Force: true
          Von_Mises_Stress: true
          Equivalent_Plastic_Strain: true
          Stress_Triaxiality: true
          Damage: true
