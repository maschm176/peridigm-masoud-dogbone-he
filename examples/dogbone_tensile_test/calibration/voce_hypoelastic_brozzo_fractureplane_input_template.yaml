Peridigm:

#     Dogbone specimen calibration template: Isotropic Hardening Hypoelastic
#     Correspondence with Voce ("Saturation type exponential") hardening +
#     Brozzo/Wellman ductile damage (Behzadinasab & Foster 2020, "Revisiting
#     the third Sandia Fracture Challenge"). This swaps out the Johnson Cook
#     damage law (which drives bond failure off triaxiality alone) for a
#     rate-form law driven by bond-level maximum principal stress and
#     hydrostatic stress:
#         D_dot = d1 * <2*sigmaT/(3*(sigmaT-sigmaM))>^d2 * eqps_dot
#     gated to tension only. See Peridigm_BrozzoDamageModel.cpp/.hpp and the
#     Bond_Max_Principal_Stress field added to
#     isotropic_hardening_correspondence.cxx's Saturation-type-exponential
#     bond-level update. Requires the peridigm-masoud:voce-hypoelastic-brozzo
#     image (set via the IMAGE env var in the wrapper driver script), rebuilt
#     2026-09-30 to add the "Fracture Plane Cutoff" option below.
#
#     Units are CGS, matching the mesh, same as the original template.
#
#     Variant: "Option 3" from the post-fracture oscillation investigation
#     (see CLAUDE.md, "Post-fracture oscillation" section). Options 1
#     (freeze nearly-failed points early) and 2 (per-bond hard-cutoff damage
#     law) were both tried and failed to fix the oscillation -- Option 1
#     caused a numerical blowup/crash, Option 2 completed but left the
#     oscillation essentially unchanged, because both still relied on
#     individual bonds slowly, separately, patchily accumulating to full
#     failure -- a genuinely complete cross-section severance never actually
#     happens on its own.
#
#     Fracture Plane Cutoff instead forces a genuinely COMPLETE cut: once any
#     point within a fixed geometric band around "Fracture Plane Y" (the
#     specimen's own symmetric center, well-justified given the strain gage
#     points sit symmetrically at Y=+/-1.238) reaches "Fracture Trigger
#     Damage", every bond touching that band -- checked symmetrically from
#     both endpoints -- is forced to full failure (D=1) in one step, for the
#     whole band at once. Since peridynamic forces only act within a finite
#     horizon (0.236 here), once the plane is genuinely, completely severed,
#     the two halves of the specimen stop exchanging ANY force at all -- the
#     grips' reaction force (what the stress-strain curve actually measures)
#     should then depend only on their own now-isolated half, not on
#     whatever the newly-freed material does (it will fly off ballistically,
#     since zero force means zero deceleration -- this is expected, physical,
#     and does not feed back into the measured curve, because nothing
#     connects it back across the severed plane).
#
#     "Fracture Plane Half Thickness" (0.25, just over the 0.236 horizon) is
#     sized so any bond that would cross the plane geometrically is
#     guaranteed to have at least one endpoint captured by the band.
#     "Fracture Trigger Damage" (0.3) is a first guess -- fairly early/modest
#     local damage, chosen to act once real, meaningful damage genuinely
#     starts localizing at the plane rather than waiting for near-complete
#     local degradation. "Critical Damage To Neglect Material Point" is left
#     at Peridigm's default (0.95, not overridden) -- for points this
#     mechanism genuinely, fully disconnects, freezing their stress update
#     afterward is now safe (unlike Option 1, where it froze points that
#     were still substantially bonded).
#
#     Each rank scans only its own owned points, then synchronizes the
#     trigger across all ranks via an Epetra_Comm::MaxAll reduction (added
#     2026-10-01), so this runs correctly at full MPI parallelism (4 ranks,
#     same as every other run in this project) even if the fracture plane
#     ends up split across a processor boundary -- no single-rank fallback
#     needed. The added bookkeeping (a per-rank local scan plus one 8-byte
#     reduction per time step) is negligible next to the existing per-step
#     Internal Force cost, which dominates wallclock in every profiled run
#     in this project.

  Discretization:
      Type: "Exodus"
      Input Mesh File: "tensile_test.g"

  Materials:
      My Material:
          Material Model: "Isotropic Hardening Hypoelastic Correspondence"
          Density: 7.8
          Bulk Modulus: 1.30e12
          Shear Modulus: 7.8e11
          Hardening Rule: "Saturation type exponential"
          Initial Yield Stress: {InitialYieldStress}
          Saturated Yield Stress: {SaturatedYieldStress}
          Exponential Constant: {ExponentialConstant}
          Linear Constant: {LinearConstant}
          Actual Horizon: 0.189

  Damage Models:
      My Damage Model:
          Damage Model: "Brozzo"
          Damage Parameter 1: {DamageParameter1}
          Damage Parameter 2: {DamageParameter2}
          Threshold Damage: {ThresholdDamage}
          Enable Fracture Plane Cutoff: true
          Fracture Plane Y: 0.0
          Fracture Plane Half Thickness: 0.25
          Fracture Trigger Damage: 0.3

  Blocks:
      My Block:
          Block Names: "block_1 block_2 block_3"
          Material: "My Material"
          Damage Model: "My Damage Model"
          Horizon: 0.236

  Boundary Conditions:
      Prescribed Displacement Bottom:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_1"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Top:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_2"
          Coordinate: "y"
          Value: "y*45.0*t"
      Prescribed Displacement Fix Bottom Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_3"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Bottom Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_4"
          Coordinate: "z"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In X:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_5"
          Coordinate: "x"
          Value: "0.0"
      Prescribed Displacement Fix Top Rigid Body Motion In Z:
          Type: "Prescribed Displacement"
          Node Set: "nodelist_6"
          Coordinate: "z"
          Value: "0.0"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.84e-3
      Verlet:
          Safety Factor: 0.7

  Compute Class Parameters:
      Strain Gage Top Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Top_Initial_Position"
      Strain Gage Bottom Initial Position:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Model_Coordinates"
          Output Label: "Gage_Bottom_Initial_Position"
      Strain Gage Top Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: 1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Top_Displacement"
      Strain Gage Bottom Displacement:
          Compute Class: "Nearest_Point_Data"
          X: 0.0317
          Y: -1.238
          Z: 0.0
          Variable: "Displacement"
          Output Label: "Gage_Bottom_Displacement"
      Top Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_3"
          Variable: "Force"
          Output Label: "Top_Reaction_Force"
      Bottom Reaction Force:
          Compute Class: "Block_Data"
          Calculation Type: "Sum"
          Block: "block_1"
          Variable: "Force"
          Output Label: "Bottom_Reaction_Force"

  Output:
      Output File Type: "ExodusII"
      Output Filename: "output"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Force: true
          Gage_Top_Displacement: true
          Gage_Bottom_Displacement: true
          Top_Reaction_Force: true
          Bottom_Reaction_Force: true
          Damage: true
          Broken_Bond_Volume_Averaged: true
          Flying_Point_Flag: true
