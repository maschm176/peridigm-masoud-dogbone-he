Peridigm:

#     Coarse cylindrical mesh (adapted from examples/fragmenting_cylinder)
#     loaded as a simple tensile test: bottom end fixed, top end pulled
#     along the cylinder axis (z) via prescribed displacement.

  Discretization:
      Type: "Text File"
      Input Mesh File: "cylinder_tensile_test.txt"

  Materials:
      My Material:
          Material Model: "Elastic"
          Density: 7800.0
          Bulk Modulus: 130.0e9
          Shear Modulus: 78.0e9

  Blocks:
      My Block:
          Block Names: "block_1"
          Material: "My Material"
          Horizon: 0.0104

  Boundary Conditions:
      Node Set Bottom: "bottom_nodeset.txt"
      Node Set Top: "top_nodeset.txt"
      Fix Bottom X:
          Type: "Prescribed Displacement"
          Node Set: "Node Set Bottom"
          Coordinate: "x"
          Value: "0.0"
      Fix Bottom Y:
          Type: "Prescribed Displacement"
          Node Set: "Node Set Bottom"
          Coordinate: "y"
          Value: "0.0"
      Fix Bottom Z:
          Type: "Prescribed Displacement"
          Node Set: "Node Set Bottom"
          Coordinate: "z"
          Value: "0.0"
      Pull Top Z:
          Type: "Prescribed Displacement"
          Node Set: "Node Set Top"
          Coordinate: "z"
          Value: "0.0005*t"

  Solver:
      Verbose: false
      Initial Time: 0.0
      Final Time: 1.0e-3
      Verlet:
          Safety Factor: 0.7

  Output:
      Output File Type: "ExodusII"
      Output Filename: "cylinder_tensile_test"
      Output Frequency: 20
      Output Variables:
          Displacement: true
          Velocity: true
          Force: true
          Force_Density: true
          Dilatation: true
